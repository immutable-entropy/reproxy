# Unit tests, on every push to any branch.
#
# Two jobs, so the quick answer doesn't wait on the slow one:
#   core  the Qt-free packages (make test-core, with -race), plus gofmt and
#         go vet over them: a few minutes.
#   ui    the packages that need Qt (make test-ui). It runs in Ubuntu 26.04,
#         the release the devcontainer is built on, for the same Qt. The
#         first run compiles the Qt bindings (about 20 minutes); after that
#         they come from the build cache.
#
# Actions are pinned to a release's commit, chosen like a Go dependency
# (see deps-soak.allow): published 14 or more days before it is adopted.
name: Tests

on:
  push:
    branches: ['**']

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./tools)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet $(make -s print-core-pkgs)
      - name: Test
        run: make test-core

  ui:
    name: Qt packages
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 60
    steps:
      - name: Install Qt and a C++ toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make build-essential pkg-config qt6-base-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Its own cache key, apart from the core job's, so the compiled
          # Qt bindings are what this job saves and restores.
          cache-dependency-path: |
            go.sum
            go.mod
      - name: Test
        run: make test-ui
